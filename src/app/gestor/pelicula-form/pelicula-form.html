<a routerLink="/gestor/peliculas" class="back-link">‹ Volver a películas</a>

<div class="card" style="max-width: 560px;">
  <h1>{{ peliculaId() ? 'Editar película' : 'Nueva película' }}</h1>

  <form [formGroup]="form" (ngSubmit)="guardar()">
    <div class="field">
      <label>Nombre</label>
      <input formControlName="nombre" />
    </div>
    <div class="field">
      <label>Sinopsis</label>
      <textarea formControlName="sinopsis"></textarea>
    </div>
    <div class="row">
      <div class="field">
        <label>Duración (minutos)</label>
        <input type="number" formControlName="duracionMinutos" />
      </div>
      <div class="field">
        <label>Restricción de edad</label>
        <select formControlName="restriccionEdad">
          <option [ngValue]="0">Sin restricción</option>
          <option [ngValue]="13">+13</option>
          <option [ngValue]="18">+18</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label>
        <input type="checkbox" formControlName="visibleEnHome" />
        Visible en la home
      </label>
    </div>

    <div class="field">
      <label>Géneros</label>
      <div class="row">
        @for (g of generosDisponibles(); track g.id) {
          <label class="chip">
            <input
              type="checkbox"
              [checked]="generosSeleccionados().has(g.id)"
              (change)="alternarGenero(g.id)"
            />
            {{ g.nombre }}
          </label>
        }
      </div>
    </div>

    <div class="field">
      <label>Imagen</label>
      @if (imagenActualUrl(); as url) {
        <img [src]="url" alt="Imagen actual" style="width: 120px; border-radius: var(--radius-sm); margin-bottom: 8px; display: block;" />
      }

      <input
        type="file"
        accept="image/*"
        (change)="archivoSeleccionado($event)"
        id="imagen-input"
        class="file-input-oculto"
        #inputImagen
      />

      <div class="row">
        <label for="imagen-input" class="btn btn-ghost">Elegir imagen</label>
        @if (archivoImagen(); as archivo) {
          <span class="ticket-meta">{{ archivo.name }}</span>
          <button type="button" class="btn btn-danger" (click)="quitarImagen(inputImagen)">Quitar imagen</button>
        }
      </div>
    </div>

    @if (error()) {
      <p class="form-error">{{ error() }}</p>
    }

    <button type="submit" class="btn btn-primary" [disabled]="form.invalid || guardando()">Guardar</button>
  </form>
</div>
