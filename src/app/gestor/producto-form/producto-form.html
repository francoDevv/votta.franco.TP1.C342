<a routerLink="/gestor/productos" class="back-link">‹ Volver a productos</a>

<div class="card" style="max-width: 480px;">
  <h1>{{ productoId() ? 'Editar producto' : 'Nuevo producto' }}</h1>

  <form [formGroup]="form" (ngSubmit)="guardar()">
    <div class="field">
      <label>Categoría</label>
      <select formControlName="categoria_id">
        <option [ngValue]="0" disabled>Elegí una categoría</option>
        @for (c of categorias(); track c.id) {
          <option [ngValue]="c.id">{{ c.nombre }}</option>
        }
      </select>
    </div>
    <div class="field">
      <label>Nombre</label>
      <input formControlName="nombre" />
    </div>
    <div class="field">
      <label>Descripción</label>
      <textarea formControlName="descripcion"></textarea>
    </div>
    <div class="field">
      <label>Precio</label>
      <input type="number" formControlName="precio" step="0.01" />
    </div>
    <div class="field">
      <label>
        <input type="checkbox" formControlName="disponible" />
        Disponible para la venta
      </label>
    </div>

    @if (error()) {
      <p class="form-error">{{ error() }}</p>
    }

    <button type="submit" class="btn btn-primary" [disabled]="form.invalid || guardando()">Guardar</button>
  </form>
</div>
