<a routerLink="/gestor/funciones" class="back-link">‹ Volver a funciones</a>

<div class="card" style="max-width: 620px;">
  <h1>Nueva función</h1>

  <form [formGroup]="form" (ngSubmit)="guardar()">
    <div class="field">
      <label>Película</label>
      <select formControlName="peliculaId">
        <option [ngValue]="0" disabled>Elegí una película</option>
        @for (p of peliculas(); track p.id) {
          <option [ngValue]="p.id">{{ p.nombre }}</option>
        }
      </select>
    </div>

    <div class="field">
      <label>Días de la semana</label>
      <div class="row">
        @for (d of dias; track d.valor) {
          <label class="chip">
            <input type="checkbox" [checked]="diasSeleccionados().has(d.valor)" (change)="alternarDia(d.valor)" />
            {{ d.nombre }}
          </label>
        }
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label>Hora</label>
        <input type="time" formControlName="hora" />
      </div>
      <div class="field">
        <label>Desde</label>
        <input type="date" formControlName="fechaDesde" />
      </div>
      <div class="field">
        <label>Hasta</label>
        <input type="date" formControlName="fechaHasta" />
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label>Formato</label>
        <select formControlName="formato">
          <option value="2D">2D</option>
          <option value="3D">3D</option>
          <option value="4D">4D</option>
          <option value="5D">5D</option>
        </select>
      </div>
      <div class="field">
        <label>Idioma</label>
        <select formControlName="idioma">
          <option value="castellano">Castellano</option>
          <option value="subtitulada">Subtitulada</option>
        </select>
      </div>
    </div>

    @if (error()) {
      <p class="form-error">{{ error() }}</p>
    }

    <button type="submit" class="btn btn-primary" [disabled]="guardando()">Crear funciones</button>
  </form>
</div>

@if (resultado(); as r) {
  <h2 style="margin-top: 28px;">Resultado</h2>
  <div class="card">
    @for (item of r; track item.fecha) {
      <p>
        {{ item.fecha }}:
        @if (item.asignada) {
          asignada a la sala {{ item.sala_id }}
        } @else {
          <strong style="color: var(--accent);">sin sala disponible</strong>
        }
      </p>
    }
  </div>
}
