<a routerLink="/gestor/combos" class="back-link">‹ Volver a combos</a>

<div class="card" style="max-width: 520px;">
  <h1>{{ comboId() ? 'Editar combo' : 'Nuevo combo' }}</h1>

  <form [formGroup]="form" (ngSubmit)="guardar()">
    <div class="field">
      <label>Nombre</label>
      <input formControlName="nombre" />
    </div>
    <div class="field">
      <label>Descripción</label>
      <textarea formControlName="descripcion"></textarea>
    </div>
    <div class="field">
      <label>Precio fijo del combo</label>
      <input type="number" formControlName="precio" step="0.01" />
    </div>
    <div class="row">
      <label class="chip">
        <input type="checkbox" formControlName="destacado" />
        Destacado en la compra
      </label>
      <label class="chip">
        <input type="checkbox" formControlName="disponible" />
        Disponible
      </label>
    </div>

    <div class="field">
      <label>Productos incluidos</label>
      @for (item of items(); track $index) {
        <div class="row" style="margin-bottom: 8px;">
          <select (change)="actualizarProducto($index, +$any($event.target).value)">
            @for (p of productos(); track p.id) {
              <option [value]="p.id" [selected]="p.id === item.producto_id">{{ p.nombre }}</option>
            }
          </select>
          <input
            type="number"
            min="1"
            [value]="item.cantidad"
            (input)="actualizarCantidad($index, +$any($event.target).value)"
            style="width: 70px;"
          />
          <button type="button" class="btn btn-danger" (click)="quitarItem($index)">Quitar</button>
        </div>
      }
      <button type="button" class="btn btn-ghost" (click)="agregarItem()">+ Agregar producto</button>
    </div>

    @if (error()) {
      <p class="form-error">{{ error() }}</p>
    }

    <button type="submit" class="btn btn-primary" [disabled]="guardando()">Guardar</button>
  </form>
</div>
