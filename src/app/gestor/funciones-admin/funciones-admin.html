<div class="row" style="justify-content: space-between; margin-bottom: 20px;">
  <h1 style="margin: 0;">Funciones</h1>
  <a routerLink="/gestor/funciones/nueva" class="btn btn-primary">+ Nueva función</a>
</div>

@if (cargando()) {
  <p>Cargando…</p>
} @else {
  <table>
    <thead>
      <tr><th>Película</th><th>Sala</th><th>Inicio</th><th>Formato</th><th>Idioma</th><th></th></tr>
    </thead>
    <tbody>
      @for (f of funciones(); track f.id) {
        <tr>
          <td>{{ f.peliculas.nombre }}</td>
          <td>{{ f.salas.nombre }}</td>
          <td>{{ f.inicio | date: 'dd/MM HH:mm' }}</td>
          <td>{{ f.formato }}</td>
          <td>{{ f.idioma }}</td>
          <td><button class="btn btn-danger" (click)="eliminar(f)">Eliminar</button></td>
        </tr>
      } @empty {
        <tr><td colspan="6">No hay funciones próximas.</td></tr>
      }
    </tbody>
  </table>
}
