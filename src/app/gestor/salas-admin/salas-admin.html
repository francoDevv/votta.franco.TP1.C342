<h1>Salas</h1>

<div class="row" style="margin-bottom: 20px;">
  <input
    [value]="nombreNuevo()"
    (input)="nombreNuevo.set($any($event.target).value)"
    placeholder="Nombre de la sala (ej: Sala 1)"
  />
  <button class="btn btn-primary" (click)="crear()" [disabled]="creando() || !nombreNuevo().trim()">Crear sala</button>
</div>
@if (error()) {
  <p class="form-error">{{ error() }}</p>
}

@if (cargando()) {
  <p>Cargando…</p>
} @else {
  <table>
    <thead><tr><th>Nombre</th><th></th></tr></thead>
    <tbody>
      @for (s of salas(); track s.id) {
        <tr>
          <td>{{ s.nombre }}</td>
          <td>
            <div class="row">
              <a [routerLink]="['/gestor/salas', s.id]" class="btn btn-ghost">Ver mapa</a>
              <button class="btn btn-danger" (click)="eliminar(s)">Eliminar</button>
            </div>
          </td>
        </tr>
      } @empty {
        <tr><td colspan="2">No hay salas creadas todavía.</td></tr>
      }
    </tbody>
  </table>
}
